name: Refresh profile card

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/profile-signal.yml"
      - "scripts/**"
      - "config/profile.json"
      - "assets/fonts/**"
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-card
  cancel-in-progress: true

jobs:
  refresh:
    if: github.repository == 'Anandb71/Anandb71'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pillow==12.1.0 numpy==2.4.3

      - name: Generate card and panels
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # optional fine-grained PAT; adds private-repo commits to the counts
          PROFILE_TOKEN: ${{ secrets.PROFILE_TOKEN }}
        run: |
          python scripts/neofetch.py --output dist
          python scripts/panels.py --output dist

      - name: Validate generated assets
        run: |
          python - <<'PY'
          import json
          import xml.etree.ElementTree as ET
          from pathlib import Path

          out = Path("dist")
          required = {"neofetch-dark.svg", "neofetch-light.svg", "neofetch-data.json", "work-dark.svg", "work-light.svg"}
          missing = required - {p.name for p in out.iterdir()}
          if missing:
              raise SystemExit(f"Missing generated assets: {sorted(missing)}")
          for path in out.glob("*.svg"):
              ET.parse(path)
          json.loads((out / "neofetch-data.json").read_text(encoding="utf-8"))
          print(f"Validated {len(list(out.iterdir()))} files.")
          PY

      - name: Publish generated assets
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: output
          publish_dir: ./dist
          force_orphan: true
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
          commit_message: "chore: refresh profile card"
