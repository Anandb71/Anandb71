name: Refresh profile card, signal and streak

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/profile-signal.yml"
      - "scripts/generate-profile-assets.py"
      - "scripts/neofetch.py"
      - "scripts/panels.py"
      - "config/profile.json"
      - "assets/fonts/**"
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-signal
  cancel-in-progress: true

jobs:
  refresh:
    if: github.repository == 'Anandb71/Anandb71'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install card dependencies
        run: python -m pip install --disable-pip-version-check pillow==12.1.0 numpy==2.4.3

      - name: Generate neofetch card from the avatar and live stats
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # optional fine-grained PAT; adds private-repo commits to the counts
          PROFILE_TOKEN: ${{ secrets.PROFILE_TOKEN }}
        run: python scripts/neofetch.py --output dist

      - name: Generate self-hosted signal and streak cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USERNAME: ${{ github.repository_owner }}
        run: python3 scripts/generate-profile-assets.py --output dist

      - name: Generate theme-aware contribution snake
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-light&color_snake=#A85A00&color_dots=#EEF1F4,#9BE9A8,#40C463,#30A14E,#216E39
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#F5A524&color_dots=#11161D,#1F6F35,#2EA043,#56D364,#7CF58A

      - name: Generate terminal README panels (wraps the snake)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_TOKEN: ${{ secrets.PROFILE_TOKEN }}
        run: python scripts/panels.py --output dist

      - name: Validate generated profile assets
        run: |
          python3 - <<'PY'
          import json
          import xml.etree.ElementTree as ET
          from pathlib import Path

          output = Path("dist")
          required = {
              "github-contribution-grid-snake-dark.svg",
              "github-contribution-grid-snake.svg",
              "neofetch-dark.svg",
              "neofetch-light.svg",
              "neofetch-data.json",
              "about-dark.svg",
              "about-light.svg",
              "work-dark.svg",
              "loop-dark.svg",
              "graph-dark.svg",
              "graph-light.svg",
              "outro-dark.svg",
              "project-arbor-dark.svg",
              "link-arbor-dark.svg",
              "profile-data.json",
              "profile-signal-dark.svg",
              "profile-signal-light.svg",
          }
          present = {path.name for path in output.iterdir() if path.is_file()}
          missing = required - present
          if missing:
              raise SystemExit(f"Missing generated assets: {sorted(missing)}")

          for path in output.glob("*.svg"):
              ET.parse(path)
          json.loads((output / "profile-data.json").read_text(encoding="utf-8"))
          print(f"Validated {len(present)} generated profile assets.")
          PY

      - name: Publish generated assets
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: output
          publish_dir: ./dist
          force_orphan: true
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
          commit_message: "chore: refresh profile card, signal and streak"
