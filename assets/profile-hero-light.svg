<svg width="1200" height="480" viewBox="0 0 1200 480" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Anand B - builder and Arbor Co-Founder</title>
  <desc id="desc">A graph-inspired profile banner: Build the machine. Make it explain itself.</desc>
  <defs>
    <linearGradient id="background" x1="42" y1="24" x2="1148" y2="456" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F7FAF4"/>
      <stop offset="0.55" stop-color="#EEF5EC"/>
      <stop offset="1" stop-color="#F8F7EC"/>
    </linearGradient>
    <linearGradient id="accent" x1="64" y1="0" x2="714" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#102116"/>
      <stop offset="0.72" stop-color="#102116"/>
      <stop offset="1" stop-color="#18883D"/>
    </linearGradient>
    <linearGradient id="trace" x1="760" y1="112" x2="1116" y2="374" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A9C9AF"/>
      <stop offset="0.5" stop-color="#18883D"/>
      <stop offset="1" stop-color="#9A6710"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" stroke="#1C6332" stroke-opacity=".055"/>
    </pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <clipPath id="frame">
      <rect width="1200" height="480" rx="26"/>
    </clipPath>
    <style>
      .trace { stroke-dasharray: 8 12; animation: flow 8s linear infinite; }
      .pulse { animation: pulse 2.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .pulse-b { animation-delay: .8s; }
      .pulse-c { animation-delay: 1.6s; }
      .cursor { animation: blink 1.2s steps(2, end) infinite; }
      @keyframes flow { to { stroke-dashoffset: -80; } }
      @keyframes pulse { 0%, 100% { opacity: .45; transform: scale(.82); } 50% { opacity: 1; transform: scale(1.2); } }
      @keyframes blink { 50% { opacity: .15; } }
      @media (prefers-reduced-motion: reduce) {
        .trace, .pulse, .cursor { animation: none; }
      }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="480" fill="url(#background)"/>
    <rect width="1200" height="480" fill="url(#grid)"/>
    <circle cx="1110" cy="56" r="220" fill="#18883D" fill-opacity=".045"/>
    <circle cx="80" cy="510" r="270" stroke="#18883D" stroke-opacity=".07"/>
    <circle cx="80" cy="510" r="210" stroke="#18883D" stroke-opacity=".06"/>
    <path d="M-30 415C112 341 191 452 330 386C468 320 536 430 674 359" stroke="#A7BFAA" stroke-opacity=".7"/>
    <path class="trace" d="M-30 415C112 341 191 452 330 386C468 320 536 430 674 359" stroke="#18883D" stroke-opacity=".55"/>

    <g transform="translate(64 48)">
      <rect width="318" height="38" rx="19" fill="#FFFFFF" stroke="#BFD3C2"/>
      <circle class="pulse" cx="20" cy="19" r="5" fill="#18883D"/>
      <text x="37" y="24" fill="#285B35" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" letter-spacing="1.4">COFOUNDER / GETARBOR.DEV</text>
    </g>

    <text x="64" y="136" fill="#52705A" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="700" letter-spacing="5">ANAND B / SYSTEMS BUILDER</text>
    <text x="60" y="214" fill="url(#accent)" font-family="Georgia, Times New Roman, serif" font-size="66" font-weight="700">Build the machine.</text>
    <text x="60" y="284" fill="#18883D" font-family="Georgia, Times New Roman, serif" font-size="58" font-style="italic" font-weight="700">Make it explain itself.</text>
    <text x="66" y="330" fill="#52675A" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17">
      Graph-native code intelligence / agent context / local-first systems
    </text>

    <g transform="translate(64 374)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" letter-spacing=".8">
      <rect width="190" height="34" rx="7" fill="#FFFFFF" stroke="#C2D4C4"/>
      <text x="18" y="22" fill="#274831">RUST / GRAPH SYSTEMS</text>
      <rect x="202" width="190" height="34" rx="7" fill="#FFFFFF" stroke="#C2D4C4"/>
      <text x="220" y="22" fill="#274831">MCP / AGENT CONTEXT</text>
      <rect x="404" width="212" height="34" rx="7" fill="#FFFFFF" stroke="#C2D4C4"/>
      <text x="422" y="22" fill="#274831">TAMIL NADU / INDIA</text>
    </g>

    <g transform="translate(756 72)">
      <rect width="384" height="336" rx="20" fill="#FFFFFF" fill-opacity=".94" stroke="#9CC5A4"/>
      <rect x="1" y="1" width="382" height="46" rx="19" fill="#E7F2E7"/>
      <circle cx="23" cy="24" r="4" fill="#18883D"/>
      <circle cx="39" cy="24" r="4" fill="#9A6710" fill-opacity=".8"/>
      <circle cx="55" cy="24" r="4" fill="#A6BEAA"/>
      <text x="78" y="29" fill="#3A6B45" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700">arbor://pr-walk/184</text>

      <text x="28" y="84" fill="#66816C" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="700" letter-spacing="1.5">DETERMINISTIC BLAST-RADIUS</text>
      <text x="28" y="112" fill="#142119" font-family="Georgia, Times New Roman, serif" font-size="25" font-weight="700">checkout-webhook</text>

      <path d="M55 169C104 169 108 149 153 149C200 149 193 194 241 194C290 194 291 164 334 164" stroke="#B2CBB7" stroke-width="2"/>
      <path class="trace" d="M55 169C104 169 108 149 153 149C200 149 193 194 241 194C290 194 291 164 334 164" stroke="url(#trace)" stroke-width="2"/>
      <circle cx="55" cy="169" r="10" fill="#FFFFFF" stroke="#18883D"/>
      <circle class="pulse pulse-b" cx="153" cy="149" r="8" fill="#18883D"/>
      <circle cx="241" cy="194" r="10" fill="#FFFFFF" stroke="#9A6710"/>
      <circle class="pulse pulse-c" cx="334" cy="164" r="8" fill="#9A6710"/>

      <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="700">
        <text x="37" y="195" fill="#607A65">DIFF</text>
        <text x="120" y="132" fill="#607A65">19 SYMBOLS</text>
        <text x="205" y="221" fill="#886A31">3 ENTRYPOINTS</text>
        <text x="292" y="145" fill="#886A31">HANDOFF</text>
      </g>

      <rect x="24" y="242" width="336" height="66" rx="10" fill="#F3F7F1" stroke="#B8CFBC"/>
      <text x="42" y="265" fill="#627B67" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">impact.status</text>
      <text x="42" y="289" fill="#8A5B08" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700">HOLD MERGE / WRITE THE TEST</text>
      <rect class="cursor" x="327" y="278" width="7" height="13" fill="#18883D"/>
    </g>
  </g>

  <rect x=".5" y=".5" width="1199" height="479" rx="25.5" stroke="#B7CDBA"/>
</svg>
